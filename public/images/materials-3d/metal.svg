<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="metalShine">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
    </radialGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sombra -->
  <ellipse cx="200" cy="350" rx="120" ry="20" fill="rgba(0,0,0,0.2)"/>
  
  <!-- Lingote de oro principal -->
  <g filter="url(#shadow)">
    <!-- Cara frontal -->
    <path d="M 120 180 L 280 180 L 260 280 L 140 280 Z" fill="url(#metalGradient)" stroke="#B8860B" stroke-width="2"/>
    
    <!-- Cara superior -->
    <path d="M 120 180 L 200 140 L 280 180 Z" fill="#FFE55C" stroke="#B8860B" stroke-width="2"/>
    
    <!-- Cara lateral derecha -->
    <path d="M 280 180 L 260 280 L 220 260 L 200 140 Z" fill="#DAA520" stroke="#B8860B" stroke-width="2"/>
    
    <!-- Detalles de brillo -->
    <ellipse cx="180" cy="200" rx="30" ry="15" fill="url(#metalShine)" opacity="0.6"/>
    <ellipse cx="220" cy="220" rx="20" ry="10" fill="url(#metalShine)" opacity="0.4"/>
    
    <!-- Texto grabado -->
    <text x="200" y="235" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#B8860B" text-anchor="middle">Au</text>
    <text x="200" y="255" font-family="Arial, sans-serif" font-size="12" fill="#B8860B" text-anchor="middle">999.9</text>
  </g>
</svg>
