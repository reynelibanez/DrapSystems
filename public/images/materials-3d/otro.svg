<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boxGenericGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9370DB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8A2BE2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6A1B9A;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="genericShine">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#9370DB;stop-opacity:0" />
    </radialGradient>
    <filter id="genericShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sombra -->
  <ellipse cx="200" cy="350" rx="120" ry="20" fill="rgba(0,0,0,0.2)"/>
  
  <!-- Caja genérica 3D -->
  <g filter="url(#genericShadow)">
    <!-- Cara frontal -->
    <rect x="120" y="180" width="160" height="140" fill="url(#boxGenericGradient)" stroke="#6A1B9A" stroke-width="3"/>
    
    <!-- Cara superior -->
    <path d="M 120 180 L 160 150 L 320 150 L 280 180 Z" fill="#BA55D3" stroke="#6A1B9A" stroke-width="3"/>
    
    <!-- Cara lateral derecha -->
    <path d="M 280 180 L 320 150 L 320 290 L 280 320 Z" fill="#8A2BE2" stroke="#6A1B9A" stroke-width="3"/>
    
    <!-- Símbolo de interrogación -->
    <g transform="translate(200, 240)">
      <!-- Círculo superior del ? -->
      <path d="M -20 -40 Q -20 -60 0 -60 Q 20 -60 20 -40 Q 20 -20 0 -10" 
            fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
      <!-- Punto del ? -->
      <circle cx="0" cy="10" r="8" fill="#FFFFFF"/>
    </g>
    
    <!-- Detalles decorativos -->
    <circle cx="150" cy="200" r="8" fill="#BA55D3" opacity="0.6"/>
    <circle cx="250" cy="200" r="8" fill="#BA55D3" opacity="0.6"/>
    <circle cx="150" cy="300" r="8" fill="#BA55D3" opacity="0.6"/>
    <circle cx="250" cy="300" r="8" fill="#BA55D3" opacity="0.6"/>
    
    <!-- Brillos -->
    <ellipse cx="180" cy="210" rx="25" ry="15" fill="url(#genericShine)" opacity="0.6"/>
    <ellipse cx="220" cy="230" rx="20" ry="12" fill="url(#genericShine)" opacity="0.4"/>
    
    <!-- Líneas decorativas -->
    <line x1="130" y1="190" x2="270" y2="190" stroke="#BA55D3" stroke-width="2" opacity="0.4"/>
    <line x1="130" y1="310" x2="270" y2="310" stroke="#6A1B9A" stroke-width="2" opacity="0.4"/>
  </g>
</svg>
