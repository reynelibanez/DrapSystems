<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="threadGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4169E1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E90FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066CC;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="spoolShine">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#4169E1;stop-opacity:0" />
    </radialGradient>
    <filter id="spoolShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sombra -->
  <ellipse cx="200" cy="340" rx="110" ry="20" fill="rgba(0,0,0,0.2)"/>
  
  <!-- Carrete de hilo -->
  <g filter="url(#spoolShadow)">
    <!-- Base del carrete (cilindro inferior) -->
    <ellipse cx="200" cy="280" rx="90" ry="25" fill="#2F4F4F" stroke="#1C1C1C" stroke-width="2"/>
    <rect x="110" y="180" width="180" height="100" fill="#3A3A3A" stroke="#1C1C1C" stroke-width="2"/>
    <ellipse cx="200" cy="180" rx="90" ry="25" fill="#4A4A4A" stroke="#1C1C1C" stroke-width="2"/>
    
    <!-- Hilo enrollado -->
    <ellipse cx="200" cy="200" rx="70" ry="20" fill="url(#threadGradient)"/>
    <rect x="130" y="200" width="140" height="60" fill="url(#threadGradient)"/>
    <ellipse cx="200" cy="260" rx="70" ry="20" fill="#0066CC"/>
    
    <!-- Líneas de hilo -->
    <path d="M 130 210 Q 200 205 270 210" stroke="#87CEEB" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 130 220 Q 200 215 270 220" stroke="#87CEEB" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 130 230 Q 200 225 270 230" stroke="#87CEEB" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 130 240 Q 200 235 270 240" stroke="#87CEEB" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 130 250 Q 200 245 270 250" stroke="#87CEEB" stroke-width="1.5" fill="none" opacity="0.6"/>
    
    <!-- Brillo en el hilo -->
    <ellipse cx="200" cy="220" rx="40" ry="12" fill="url(#spoolShine)" opacity="0.7"/>
    
    <!-- Hilo suelto -->
    <path d="M 270 230 Q 300 200 320 180 Q 330 160 325 140" stroke="#4169E1" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="325" cy="140" r="4" fill="#4169E1"/>
  </g>
</svg>
